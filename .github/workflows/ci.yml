name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # The end-to-end suite drives the real app in a browser. It is the only
  # thing here that catches a broken screen — a form that overwrites the last
  # expense, a button missing from where it is needed, a list claiming to be
  # empty while it loads. All of those typecheck.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        # Traces and screenshots of whatever failed, so a red run can be read
        # without reproducing it locally.
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
